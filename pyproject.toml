[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdesk"
version = "0.1.0"
description = "Local quantitative analysis & trade suggestions: Monte Carlo, probability cones, cointegration, fractional Kelly. Classical math only."
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "yfinance>=0.2.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[tool.setuptools]
packages = ["quantdesk", "quantdesk.data", "quantdesk.engines", "quantdesk.backtest"]
